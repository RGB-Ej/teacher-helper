<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teacher Helper</title>
  <meta name="description" content="Track hourly English lessons: students, schedule, hours, earnings and payments.">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-title" content="Teacher Helper">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="icon.svg" alt="" width="38" height="38">
      <div>
        <strong>Teacher Helper</strong>
        <small id="teacherLabel">Hourly lessons tracker</small>
      </div>
    </div>
    <nav class="tabs" aria-label="Main">
      <button data-view="dashboard">Dashboard</button>
      <button data-view="schedule">Schedule</button>
      <button data-view="students">Students</button>
      <button data-view="billing">Billing</button>
      <button data-view="settings">Settings</button>
    </nav>
  </header>

  <main id="view"></main>

  <dialog id="modal"><form id="modalForm" novalidate></form></dialog>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
